
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tools Hub</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="logo">AI<span>.</span></div>

  <nav>
    <a href="#tools">Tools</a>
    <a href="login.html">Login</a>
  </nav>

  <button class="btnPrimary" onclick="location.href='login.html'">Start</button>
</header>

<section class="hero">

  <h1>Baue Ideen mit KI</h1>
  <p>Chat, Code, Games, Apps und Tools – alles in einem System.</p>

</section>

<section id="tools" class="grid">

  <div class="card" onclick="go('Chat Assistant','chat')">
    🤖<h3>AI Chat</h3><p>Konversation mit KI</p>
  </div>

  <div class="card" onclick="go('Code Helper','code')">
    💻<h3>Code Tool</h3><p>Programmieren lassen</p>
  </div>

  <div class="card" onclick="go('Game Creator','game')">
    🎮<h3>Game Creator</h3><p>Spiel-Ideen + Struktur</p>
  </div>

  <div class="card" onclick="go('Startup Builder','startup')">
    🚀<h3>Startup Tool</h3><p>Business Ideen</p>
  </div>

  <div class="card" onclick="go('App Builder','app')">
    📱<h3>App Builder</h3><p>App Konzepte</p>
  </div>

</section>

<script>
function go(name,type){
  location.href = `tool.html?name=${encodeURIComponent(name)}&type=${type}`;
}
</script>

</body>
</html>
