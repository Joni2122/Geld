<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AI Tool</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body{
            margin:0;
            font-family:Inter,sans-serif;
            background:#05070d;
            color:white;
        }

        .toolPage{
            padding:120px 8%;
        }

        #toolBox{
            margin-top:30px;
        }

        textarea{
            width:100%;
            height:120px;
            padding:12px;
            border-radius:12px;
            border:none;
            outline:none;
            background:rgba(255,255,255,0.08);
            color:white;
            margin-bottom:10px;
        }

        button{
            padding:12px 18px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#4f8cff,#6a5cff);
            color:white;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="background">
    <div class="blur one"></div>
    <div class="blur two"></div>
</div>

<header>
    <div class="logo">AI<span>.</span></div>
    <nav>
        <a href="index.html">Back</a>
    </nav>
</header>

<div class="toolPage">

    <h1 id="toolName">Tool</h1>
    <p id="toolDesc">Beschreibung</p>

    <div id="toolBox"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const name = params.get("name") || "Tool";
const desc = params.get("desc") || "";

document.getElementById("toolName").innerText = name;
document.getElementById("toolDesc").innerText = desc;

const box = document.getElementById("toolBox");

// Chat UI
box.innerHTML = `
  <div id="chat" style="
    background:rgba(255,255,255,0.05);
    padding:15px;
    border-radius:15px;
    height:320px;
    overflow:auto;
    margin-bottom:15px;
  "></div>

  <div style="display:flex; gap:10px;">
    <input id="input" placeholder="Schreib etwas..." style="
      flex:1;
      padding:12px;
      border-radius:10px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.08);
      color:white;
    ">

    <button id="send">Senden</button>
  </div>
`;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

function addMessage(text, fromUser = true) {
    const div = document.createElement("div");

    div.style.margin = "8px 0";
    div.style.padding = "10px";
    div.style.borderRadius = "10px";
    div.style.maxWidth = "80%";

    div.style.background = fromUser
        ? "rgba(79,140,255,0.3)"
        : "rgba(255,255,255,0.1)";

    div.style.marginLeft = fromUser ? "auto" : "0";

    div.innerText = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// Fake KI
function botReply(msg) {
    let reply = "Ich verstehe dich.";

    if (msg.toLowerCase().includes("hallo")) {
        reply = "Hey 👋 wie kann ich helfen?";
    }
    else if (msg.toLowerCase().includes("code")) {
        reply = "Ich helfe dir beim Programmieren 💻";
    }
    else if (msg.toLowerCase().includes("idee")) {
        reply = "💡 Idee: Bau eine KI-Webseite wie diese!";
    }

    setTimeout(() => addMessage(reply, false), 600);
}

send.onclick = () => {
    if (!input.value.trim()) return;

    addMessage(input.value, true);
    botReply(input.value);

    input.value = "";
};

input.addEventListener("keydown", e => {
    if (e.key === "Enter") send.click();
});
</script>

</body>
</html>
