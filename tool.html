<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>

<body>

<div class="background">
  <div class="blur one"></div>
  <div class="blur two"></div>
</div>

<header>
  <div class="logo">AI<span>.</span></div>
  <button class="login" onclick="window.location='index.html'">← Back</button>
</header>

<main class="toolWrap">

<div class="toolHeader">
  <h1 id="title"></h1>
</div>

<div class="chatCard">

<div id="chat"></div>

<div class="chatInput">
  <input id="input" placeholder="Beschreibe etwas...">
  <button id="send">Senden</button>
</div>

</div>

</main>

<script>
const params = new URLSearchParams(location.search);
const type = params.get("type") || "chat";
document.getElementById("title").innerText = params.get("name") || "Tool";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

function add(t,c){
  const d=document.createElement("div");
  d.className=c;
  d.innerText=t;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function bot(msg){
  msg = msg.toLowerCase();

  if(type==="game"){
    return "🎮 Game Idee:\n\nMechanik: " + msg +
    "\n\nCharaktere: Spieler + Gegner\nLevel: 3–5 Stages\nZiel: Score System + Progression\n\n💡 Optional: Multiplayer später";
  }

  if(type==="app"){
    return "📱 App Idee:\n" + msg + "\n\nFeatures: Login, Profile, Datenbank";
  }

  if(type==="startup"){
    return "🚀 Startup Idee:\n" + msg + "\n\nMonetarisierung: Ads + Premium";
  }

  if(msg.includes("code")) return "💻 Ich helfe dir beim Code!";
  if(msg.includes("idee")) return "💡 Gute Idee!";
  return "Ich habe das verstanden.";
}

function sendMsg(){
  const v=input.value.trim();
  if(!v)return;

  add(v,"user");
  input.value="";

  setTimeout(()=>{
    add(bot(v),"bot");
  },300);
}

send.onclick=sendMsg;
input.addEventListener("keydown",e=>e.key==="Enter"&&sendMsg());

add("Beschreibe dein Projekt 👋","bot");
</script>

</body>
</html>
