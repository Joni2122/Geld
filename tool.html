<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="background">
    <div class="blur one"></div>
    <div class="blur two"></div>
</div>

<header>
    <div class="logo">AI<span>.</span></div>
    <div class="headerActions">
        <button class="ghostBtn" id="themeButton">🌙</button>
        <a class="backBtn" href="index.html">← Zurück</a>
    </div>
</header>

<main class="toolPage">
    <div class="toolPageTop">
        <div>
            <h1 id="toolName">Tool</h1>
            <p id="toolDesc">Beschreibung</p>
        </div>
    </div>

    <div id="toolBox"></div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const toolName = params.get("name") || "Tool";
const toolDesc = params.get("desc") || "";
const toolType = params.get("type") || "chat";

document.getElementById("toolName").innerText = toolName;
document.getElementById("toolDesc").innerText = toolDesc;

const themeButton = document.getElementById("themeButton");
const themeKey = "ai-toolbox-theme";

function applyTheme(theme) {
    document.body.classList.toggle("lightTheme", theme === "light");
    localStorage.setItem(themeKey, theme);
    if (themeButton) {
        themeButton.textContent = theme === "light" ? "☀️" : "🌙";
    }
}
applyTheme(localStorage.getItem(themeKey) || "dark");

if (themeButton) {
    themeButton.addEventListener("click", () => {
        const current = localStorage.getItem(themeKey) || "dark";
        applyTheme(current === "dark" ? "light" : "dark");
    });
}

const box = document.getElementById("toolBox");

function esc(text){
    return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function renderChatTool() {
    box.innerHTML = `
        <div class="chatShell">
            <div id="chat"></div>

            <div class="inputBox">
                <input id="input" placeholder="Schreib etwas...">
                <button id="send">Senden</button>
            </div>
        </div>
    `;

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function reply(msg) {
        const lower = msg.toLowerCase();

        if (lower.includes("hallo") || lower.includes("hi")) return "Hey 👋 Wie kann ich dir helfen?";
        if (lower.includes("code")) return "Klar 💻 Ich helfe dir gern beim Programmieren.";
        if (lower.includes("idee")) return "💡 Idee: Bau ein kleines Tool, das eine echte Funktion hat.";
        if (lower.includes("website")) return "Du kannst die Seite später mit Login, Favoriten und echten KI-Funktionen erweitern.";
        return "Ich hab dich verstanden.";
    }

    function sendMessage() {
        const msg = input.value.trim();
        if (!msg) return;

        addMessage(msg, "user");
        input.value = "";

        setTimeout(() => {
            addMessage(reply(msg), "bot");
        }, 350);
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
    });

    addMessage("Hallo! Schreib mir etwas.", "bot");
}

function renderTextTool(label, placeholder) {
    box.innerHTML = `
        <div class="panel">
            <textarea id="toolInput" placeholder="${esc(placeholder)}"></textarea>
            <button id="toolAction">${esc(label)}</button>
            <div id="toolResult" class="contactCard" style="min-height:120px;"></div>
        </div>
    `;

    const input = document.getElementById("toolInput");
    const action = document.getElementById("toolAction");
    const result = document.getElementById("toolResult");

    action.addEventListener("click", () => {
        const value = input.value.trim();
        if (!value) {
            result.innerHTML = `<p>Bitte zuerst etwas eingeben.</p>`;
            return;
        }

        result.innerHTML = `<p>${esc(makeReply(toolType, value))}</p>`;
    });
}

function makeReply(type, value) {
    const lower = value.toLowerCase();

    switch (type) {
        case "image":
            return `Bildidee erstellt: "${value}"`;
        case "code":
            return `Code-Tipp: Zerlege dein Problem in kleine Funktionen. Input war: "${value}"`;
        case "text":
            return `Überarbeitete Version: "${value}" → klarer, kürzer und sauberer formuliert.`;
        case "seo":
            return `SEO-Hinweis: Verwende dein wichtigstes Keyword im Titel und in den ersten 100 Wörtern.`;
        case "idea":
            return `Neue Idee: Mach aus "${value}" ein kleines Tool mit Favoriten und Suche.`;
        case "logo":
            return `Logo-Idee: Modern, minimal, dunkler Hintergrund, heller Neon-Akzent für "${value}".`;
        case "email":
            return `E-Mail-Vorschlag: Freundlich starten, kurz erklären, klare Bitte am Ende.`;
        default:
            return lower.includes("hallo") ? "Hey 👋" : `Antwort zu: ${value}`;
    }
}

if (toolType === "chat") {
    renderChatTool();
} else if (toolType === "image") {
    renderTextTool("Bildidee generieren", "Beschreibe dein Bild...");
} else if (toolType === "code") {
    renderTextTool("Code-Hilfe holen", "Beschreibe dein Programmierproblem...");
} else if (toolType === "text") {
    renderTextTool("Text verbessern", "Füge deinen Text ein...");
} else if (toolType === "seo") {
    renderTextTool("SEO prüfen", "Füge deinen Text oder deine URL-Beschreibung ein...");
} else if (toolType === "idea") {
    renderTextTool("Ideen generieren", "Schreibe dein Thema...");
} else if (toolType === "logo") {
    renderTextTool("Logo-Idee erstellen", "Schreibe deine Marke oder deinen Namen...");
} else if (toolType === "email") {
    renderTextTool("E-Mail schreiben", "Schreibe kurz, worum es geht...");
} else {
    renderChatTool();
}
</script>

</body>
</html>
