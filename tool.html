<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<div class="background">
    <div class="blur one"></div>
    <div class="blur two"></div>
</div>

<header>
    <div class="logo">AI<span>.</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

    <div class="headerActions">
        <button class="ghostBtn" id="themeButton">🌙</button>
    </div>
</header>

<main class="toolPage">

    <div class="toolPageTop">
        <a class="backBtn" href="index.html">← Zurück</a>

        <div>
            <h1 id="toolName">Tool</h1>
            <p id="toolDesc">Beschreibung</p>
        </div>
    </div>

    <div id="toolBox"></div>

</main>

<script>
const params = new URLSearchParams(window.location.search);

const toolName = params.get("name") || "Tool";
const toolDesc = params.get("desc") || "";
const toolType = params.get("type") || "chat";

document.getElementById("toolName").innerText = toolName;
document.getElementById("toolDesc").innerText = toolDesc;

// THEME
const themeButton = document.getElementById("themeButton");
const themeKey = "ai-theme";

function applyTheme(theme){
    document.body.classList.toggle("lightTheme", theme === "light");
    localStorage.setItem(themeKey, theme);
    if(themeButton){
        themeButton.textContent = theme === "light" ? "☀️" : "🌙";
    }
}

applyTheme(localStorage.getItem(themeKey) || "dark");

if(themeButton){
    themeButton.onclick = () => {
        const current = localStorage.getItem(themeKey) || "dark";
        applyTheme(current === "dark" ? "light" : "dark");
    };
}

const box = document.getElementById("toolBox");

/* ================= CHAT TOOL ================= */

function renderChat(){
    box.innerHTML = `
        <div class="chatShell">

            <div id="chat"></div>

            <div class="inputBox">
                <input id="input" placeholder="Schreib etwas...">
                <button id="send">Senden</button>
            </div>

        </div>
    `;

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function add(msg, type){
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = msg;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function bot(msg){
        const m = msg.toLowerCase();

        if(m.includes("hallo")) return "Hey 👋";
        if(m.includes("code")) return "Ich helfe dir beim Programmieren 💻";
        if(m.includes("idee")) return "💡 Bau ein Tool mit Login + KI";
        if(m.includes("website")) return "Du bist gerade dabei, eine SaaS Plattform zu bauen 😄";

        return "Ich hab dich verstanden.";
    }

    function sendMsg(){
        const val = input.value.trim();
        if(!val) return;

        add(val, "user");
        input.value = "";

        setTimeout(() => {
            add(bot(val), "bot");
        }, 300);
    }

    send.onclick = sendMsg;

    input.addEventListener("keydown", e=>{
        if(e.key === "Enter") sendMsg();
    });

    add("Hey! Schreib mir etwas 👋", "bot");
}

/* ================= TEXT TOOLS ================= */

function renderSimpleTool(title, placeholder, fn){

    box.innerHTML = `
        <div class="panel">

            <textarea id="input" placeholder="${placeholder}"></textarea>

            <button id="btn">${title}</button>

            <div id="result" class="contactCard"></div>

        </div>
    `;

    const input = document.getElementById("input");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    btn.onclick = () => {
        const val = input.value.trim();
        if(!val){
            result.innerText = "Bitte etwas eingeben.";
            return;
        }

        result.innerText = fn(val);
    };
}

/* ================= TOOL ROUTING ================= */

if(toolType === "chat"){
    renderChat();
}

else if(toolType === "image"){
    renderSimpleTool("Bildidee erstellen", "Beschreibe dein Bild...", v =>
        "Bildidee: " + v
    );
}

else if(toolType === "code"){
    renderSimpleTool("Code Hilfe", "Beschreibe dein Problem...", v =>
        "Tipp: Zerlege '" + v + "' in kleine Schritte."
    );
}

else if(toolType === "text"){
    renderSimpleTool("Text verbessern", "Füge deinen Text ein...", v =>
        "Verbesserte Version: " + v
    );
}

else if(toolType === "idea"){
    renderSimpleTool("Idee generieren", "Thema eingeben...", v =>
        "Idee: Mach daraus eine App → " + v
    );
}

else if(toolType === "logo"){
    renderSimpleTool("Logo Idee", "Marke eingeben...", v =>
        "Logo: modern + minimal für " + v
    );
}

else if(toolType === "email"){
    renderSimpleTool("E-Mail schreiben", "Worum geht es?", v =>
        "E-Mail Struktur für: " + v
    );
}

else{
    renderChat();
}
</script>

</body>
</html>
